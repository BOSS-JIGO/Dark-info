<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a12"><title>Dark-Info</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080a12;color:#f7f8ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center;min-height:100vh;padding:22px}.card{width:min(100%,440px);padding:30px 24px;border:1px solid #252b40;border-radius:24px;background:#131827;text-align:center;box-shadow:0 24px 80px #0008}.logo{width:76px;height:76px;object-fit:cover;border-radius:20px;margin-bottom:14px}.muted{color:#aab1c8;line-height:1.6}.spinner{width:26px;height:26px;border:3px solid #333b56;border-top-color:#7c5cff;border-radius:50%;animation:spin .8s linear infinite;margin:22px auto}@keyframes spin{to{transform:rotate(360deg)}}button,a.btn{display:block;width:100%;padding:13px 16px;margin-top:12px;border:0;border-radius:13px;background:#7c5cff;color:white;font-weight:700;text-decoration:none;font-size:15px}.small{font-size:12px;color:#737d99;margin-top:18px;overflow-wrap:anywhere}</style></head>
<body><main class="card"><img class="logo" id="logo" hidden alt=""><h1 id="title">Dark-Info</h1><p class="muted" id="message">GitHub settings load ho rahi hain…</p><div class="spinner" id="spinner"></div><div id="actions"></div><p class="small" id="status">Remote config: GitHub</p></main>
<script>
(function(){'use strict';
var CONFIG='https://raw.githubusercontent.com/BOSS-JIGO/Dark-info/main/config.json';
var D={enabled:true,maintenance:false,maintenance_message:'Service temporarily unavailable.',website_url:'https://dark-info.site/demo/index.php',app_name:'Dark-Info',logo_url:'',announcement:'',announcement_url:'',buttons:[],poll_seconds:15};
var busy=false,started=false,lastTarget='';
function url(v){try{var u=new URL(String(v||''));return /^(https?):$/.test(u.protocol)?u.href:''}catch(e){return ''}}
function get(cb){try{var x=new XMLHttpRequest();x.open('GET',CONFIG+'?t='+Date.now(),true);x.timeout=10000;x.onreadystatechange=function(){if(x.readyState!==4)return;if(x.status>=200&&x.status<300){try{cb(Object.assign({},D,JSON.parse(x.responseText)),true);return}catch(e){}}cb(D,false)};x.onerror=function(){cb(D,false)};x.ontimeout=function(){cb(D,false)};x.send()}catch(e){cb(D,false)}}
function by(id){return document.getElementById(id)}
function show(c,t,m,spin){by('title').textContent=t||c.app_name||'Dark-Info';by('message').textContent=m||'';by('spinner').style.display=spin?'block':'none';by('actions').replaceChildren();var l=url(c.logo_url);by('logo').hidden=!l;if(l)by('logo').src=l;if(c.announcement){var p=document.createElement('p');p.className='muted';p.textContent=c.announcement;by('actions').appendChild(p)}(Array.isArray(c.buttons)?c.buttons:[]).forEach(function(b){if(!b||b.enabled===false||b.visible===false)return;var u=url(b.url);if(!u)return;var a=document.createElement('a');a.className='btn';a.href=u;a.textContent=b.text||'Open';by('actions').appendChild(a)});var au=url(c.announcement_url);if(au){var a=document.createElement('a');a.className='btn';a.href=au;a.textContent='More information';by('actions').appendChild(a)}}
function run(c,ok){if(!ok){show(D,'GitHub connection problem','config.json load nahi hui. Internet check karke Retry dabayein.',false);var b=document.createElement('button');b.textContent='Retry';b.onclick=refresh;by('actions').appendChild(b);by('status').textContent='Config load failed';return}
document.title=c.app_name||'Dark-Info';by('status').textContent='GitHub config loaded';if(c.enabled===false){show(c,c.app_name,'App admin ke dwara temporarily disabled hai.',false);return}if(c.maintenance===true){show(c,c.maintenance_title||c.app_name,c.maintenance_message||'App maintenance mein hai.',false);return}
var target=url(c.website_url);if(!target||target.indexOf('boss-jigo.github.io/Dark-info')>=0){show(c,'Config error','config.json mein actual website_url set karein.',false);return}show(c,c.app_name,'Website open ho rahi hai…',true);if(target!==lastTarget){lastTarget=target;setTimeout(function(){location.replace(target)},250)}}
function refresh(){if(busy)return;busy=true;get(function(c,ok){busy=false;run(c,ok)})}
function start(){if(started)return;started=true;refresh()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script></body></html>
